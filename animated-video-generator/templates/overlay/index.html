<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #root > [data-composition-src] { position: absolute; inset: 0; overflow: hidden; }
      #bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- data-duration = délka podkladového videa (sekundy). Vyplň <LEN>. -->
    <div data-hf-id="hf-root" id="root" data-composition-id="main" data-start="0" data-duration="<LEN>" data-width="1280" data-height="720">

      <!-- PODKLAD = muted finální animace. base.mp4 dej do assets/video/. -->
      <video id="bgvid" class="clip" data-layout-ignore src="assets/video/base.mp4"
             data-start="0" data-duration="<LEN>" data-track-index="0" muted playsinline style="z-index:1"></video>

      <!-- TEXT VRSTVY (každá: class="clip" + data-start + data-duration + data-track-index + rostoucí z-index).
           Zkopíruj _example-headline.html jako šablonu, časuj na momenty ve videu. -->
      <!--
      <div class="clip" data-composition-id="headline" data-composition-src="compositions/headline.html"
           data-start="6.4" data-duration="4.0" data-track-index="1" style="z-index:2" data-width="1280" data-height="720"></div>
      <div class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html"
           data-start="37.7" data-duration="4.2" data-track-index="2" style="z-index:3" data-width="1280" data-height="720"></div>
      -->
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
